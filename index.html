:root {
  --bg:#171313;

  --card:#241f1f;

  --white:#fff;
  --muted:#c9c1c1;
  --shadow:0 12px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#fff;font-family:"Noto Sans Khmer",system-ui,sans-serif}
header{
  min-height:270px;padding:38px 18px 28px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,240,0,.08), transparent 34%),
    linear-gradient(180deg,#201b1b 0%,#171313 100%);
}
.logo{
  margin:0;color:#fff;font-size:clamp(42px,8vw,78px);font-weight:800;
  line-height:1.1;text-shadow:-3px -3px 0 #fff, 3px 3px 0 #d60000, 0 3px 0 #d60000;
  -webkit-text-stroke:2px #e00000;
}
.subtitle{margin:14px 0 0;color:var(--yellow);font-size:clamp(15px,2.8vw,22px);font-weight:600}
.toolbar{
  position:sticky;top:0;z-index:10;padding:12px max(16px,calc((100% - 1200px)/2));
  background:rgba(23,19,19,.94);backdrop-filter:blur(12px);border-bottom:1px solid #332c2c;
}
.controls{display:flex;gap:10px;align-items:center;max-width:1200px;margin:auto;flex-wrap:wrap}
.search{flex:1;min-width:220px}
input,select{
  width:100%;height:46px;border:1px solid #4a4040;border-radius:12px;background:#2a2424;color:#fff;
  padding:0 14px;font:inherit;outline:none
}
input:focus,select:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,240,0,.12)}
select{width:auto;min-width:160px}
.count{font-size:14px;color:var(--muted);white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:30px 16px 70px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{
  background:var(--card);border:2px solid var(--yellow);border-radius:20px;padding:10px;
  box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.2s transform,.2s box-shadow
}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,0,0,.4)}
.photo{aspect-ratio:1.35/1;border-radius:12px;overflow:hidden;background:#0f0d0d}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:12px 6px 5px;text-align:center}
.name{margin:0;color:var(--yellow);font-size:clamp(17px,2vw,23px);font-weight:700;line-height:1.35}
.price{margin:5px 0 0;color:#fff;font-size:clamp(17px,2vw,22px);font-weight:700}
.price span{color:var(--yellow)}
.empty{display:none;text-align:center;padding:70px 20px;color:var(--muted)}
.empty.show{display:block}
footer{padding:30px 16px;text-align:center;border-top:1px solid #332c2c;color:#9f9696;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{width:min(560px,100%);background:#211c1c;border:2px solid var(--yellow);border-radius:20px;overflow:hidden;position:relative}
.modal img{width:100%;aspect-ratio:1.2/1;object-fit:cover;display:block}
.modal-content{padding:18px;text-align:center}
.modal h2{margin:0;color:var(--yellow);font-size:28px}
.modal p{margin:7px 0;color:#fff;font-size:20px}
.close{position:absolute;right:10px;top:10px;width:40px;height:40px;border:0;border-radius:50%;background:#171313;color:#fff;font-size:24px;cursor:pointer}
@media(max-width:820px){
  header{min-height:220px;padding-top:28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  main{padding:22px 12px 55px}
}
@media(max-width:520px){
  header{
    min-height:auto;
    height:auto;
    padding:18px 12px 10px;
    justify-content:flex-start;
  }
  .logo{
    font-size:34px;
    line-height:1.05;
  }
  .subtitle{

    font-size:12px;
    line-height:1.3;
  }

  }
  .controls{

    gap:7px;
  }
  select{

  .count{

  }
  main{

  .grid{

  .card{

const grid = document.getElementById('menuGrid');
const search = document.getElementById('search');
const priceFilter = document.getElementById('priceFilter');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalName = document.getElementById('modalName');
const modalPrice = document.getElementById('modalPrice');

const money = n => new Intl.NumberFormat('en-US').format(n);

function render() {
  const q = search.value.trim().toLowerCase();
  const price = priceFilter.value;
  const filtered = menu.filter(item =>
    item.name.toLowerCase().includes(q) &&
    (price === 'all' || String(item.price) === price)
  );

  grid.innerHTML = filtered.map(item => `
    <article class="card" data-id="${item.id}">
      <div class="photo"><img src="${item.image}" alt="${item.name}" loading="lazy"></div>
      <div class="info">
        <h2 class="name">${item.name}</h2>
        <p class="price"><span>${money(item.price)}
        </span> ៛</p>
      </div>
    </article>
  `).join('');

  count.textContent = `${filtered.length} / 50 មុខ`;
  empty.classList.toggle('show', filtered.length === 0);

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(Number(card.dataset.id)));
  });
}

function openModal(id) {
  const item = menu.find(x => x.id === id);
  if (!item) return;
  modalImg.src = item.image;
  modalImg.alt = item.name;
  modalName.textContent = item.name;
  modalPrice.textContent = money(item.price) + ' ៛';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
}
search.addEventListener('input', render);
priceFilter.addEventListener('change', render);
document.getElementById('close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
render();
